<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dropGrad" x1="100" y1="30" x2="100" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D1B8FF"/>
      <stop offset="0.5" stop-color="#AE85FA"/>
      <stop offset="1" stop-color="#8C59E6"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#AE85FA" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#AE85FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="highlight" x1="80" y1="60" x2="110" y2="100">
      <stop offset="0" stop-color="white" stop-opacity="0.4"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Outer glow -->
  <circle cx="100" cy="100" r="95" fill="url(#glowGrad)">
    <animate attributeName="r" values="90;100;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbit ring -->
  <ellipse cx="100" cy="100" rx="75" ry="75" stroke="#AE85FA" stroke-width="0.5" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orbiting particles -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="8s" repeatCount="indefinite"/>
    <circle cx="175" cy="100" r="3" fill="#D1B8FF" filter="url(#blur)"/>
    <circle cx="175" cy="100" r="1.5" fill="white"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 100 100" to="480 100 100" dur="10s" repeatCount="indefinite"/>
    <circle cx="175" cy="100" r="2.5" fill="#AE85FA" filter="url(#blur)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="240 100 100" to="600 100 100" dur="14s" repeatCount="indefinite"/>
    <circle cx="170" cy="100" r="2" fill="#3EE08C" filter="url(#blur)" opacity="0.6"/>
  </g>

  <!-- The drop shape -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3s" repeatCount="indefinite"/>

    <!-- Drop shadow/glow -->
    <path d="M100 35 C100 35 65 80 65 115 C65 138 80 155 100 155 C120 155 135 138 135 115 C135 80 100 35 100 35Z"
          fill="#AE85FA" opacity="0.3" filter="url(#blur)" transform="scale(1.05 1.05)" transform-origin="100 100"/>

    <!-- Drop body -->
    <path d="M100 35 C100 35 65 80 65 115 C65 138 80 155 100 155 C120 155 135 138 135 115 C135 80 100 35 100 35Z"
          fill="url(#dropGrad)"/>

    <!-- Inner highlight -->
    <path d="M100 35 C100 35 65 80 65 115 C65 138 80 155 100 155 C120 155 135 138 135 115 C135 80 100 35 100 35Z"
          fill="url(#highlight)"/>

    <!-- Shine spot -->
    <ellipse cx="85" cy="90" rx="10" ry="18" fill="white" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Sparkle particles inside -->
  <circle cx="110" cy="105" r="1" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;95;110" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="120" r="0.8" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
